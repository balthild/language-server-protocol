# https://mago.carthage.software/guide/configuration
php-version = "8.2"

[source]
paths = ["lib/", "src/", "tests/"]
includes = ["vendor"]

[linter.rules]
valid-docblock.enabled = true
ambiguous-constant-access.enabled = true
ambiguous-function-call.enabled = true
literal-named-argument.enabled = false
prefer-early-continue.enabled = false
no-else-clause.enabled = false
no-duplicate-match-arm.enabled = false
no-shorthand-ternary.enabled = false
no-isset.enabled = false
no-boolean-flag-parameter.enabled = false
assert-description.enabled = false
readable-literal.enabled = false

too-many-methods.exclude = ["lib"]
excessive-parameter-list.exclude = ["lib"]
class-name.exclude = ["lib"]
interface-name.exclude = ["lib"]
function-name.exclude = ["lib"]
constant-name.exclude = ["lib"]
valid-docblock.exclude = ["lib"]

# https://github.com/carthage-software/mago/issues/2647
sensitive-parameter.enabled = false

[analyzer]
# ignore = ["mixed-assignment", "string-member-selector"]

# [extension-hosts]
# project.command = ["php", "internal/bin/mago-worker.php"]
